
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Product Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tech Product Manager</h1>
        <p>Manage your technology products and inventory</p>
    </header>

    <main>
        <!-- Product Form -->
        <section class="panel">
            <h2 id="formTitle">Add New Product</h2>

            <form id="productForm">
                <input type="hidden" id="productId">

                <div class="form-grid">
                    <div>
                        <label for="product_name">Product Name</label>
                        <input
                            type="text"
                            id="product_name"
                            name="product_name"
                            placeholder="e.g. MacBook Air"
                            required
                        >
                    </div>

                    <div>
                        <label for="brand">Brand</label>
                        <input
                            type="text"
                            id="brand"
                            name="brand"
                            placeholder="e.g. Apple"
                            required
                        >
                    </div>

                    <div>
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="">Select category</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Smartphone">Smartphone</option>
                            <option value="Tablet">Tablet</option>
                            <option value="Headphones">Headphones</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Monitor">Monitor</option>
                            <option value="Storage">Storage</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="price">Price</label>
                        <input
                            type="number"
                            id="price"
                            name="price"
                            placeholder="Enter price"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div>
                        <label for="stock_quantity">Stock Quantity</label>
                        <input
                            type="number"
                            id="stock_quantity"
                            name="stock_quantity"
                            placeholder="Enter quantity"
                            min="0"
                            step="1"
                            required
                        >
                    </div>

                    <div>
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter product description"
                        ></textarea>
                    </div>
                </div>

                <p id="message" role="status" aria-live="polite"></p>

                <button type="submit" class="primary" id="saveButton">
                    Save Product
                </button>

                <button
                    type="button"
                    class="secondary"
                    id="cancelButton"
                    hidden
                >
                    Cancel Edit
                </button>
            </form>
        </section>

        <!-- Products Table -->
        <section class="panel">
            <h2>Product Inventory</h2>

            <p class="stats">
                Total products: <span id="productCount">0</span>
            </p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Brand</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productTable">
                        <tr>
                            <td colspan="8">Loading products...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
